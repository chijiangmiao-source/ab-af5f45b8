services:
  web:
    build:
      context: .
      target: web
    ports:
      # 宿主机端口可通过 WEB_PORT 环境变量配置（默认 8080）
      - "${WEB_PORT:-8080}:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  # 一次性核验服务：代码测试 + 构建检查 + HTTP 冒烟，以退出码判定
  verify:
    build:
      context: .
      target: verify
    depends_on:
      web:
        condition: service_healthy
    environment:
      WEB_URL: http://web
    restart: "no"
