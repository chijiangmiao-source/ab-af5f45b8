server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # HTTP 健康检查
  location = /health {
    default_type text/plain;
    return 200 "ok\n";
  }

  # 带哈希的静态资源长缓存
  location /assets/ {
    expires 7d;
    add_header Cache-Control "public, immutable";
  }

  # SPA 回退
  location / {
    try_files $uri $uri/ /index.html;
  }
}
